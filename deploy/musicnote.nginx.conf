# MusicNote — musicnote.ddyoru.cloud
# Matches the conventions of /etc/nginx/sites-available/ddyoru on this host:
#   * port 80 is already a global "redirect to https" default_server — nothing to add here
#   * TLS via the shared canary.ddyoru.cloud multi-SAN certificate
#   * shared proxy headers from snippets/proxy-common.conf
#
# Install:
#   sudo cp /home/ubuntu/MusicNote/deploy/musicnote.nginx.conf /etc/nginx/sites-available/musicnote
#   sudo ln -sf /etc/nginx/sites-available/musicnote /etc/nginx/sites-enabled/musicnote
#   sudo nginx -t && sudo systemctl reload nginx
#
# Before it serves a valid certificate you must, once:
#   1. add a DNS A record:  musicnote.ddyoru.cloud  ->  <this server's public IP>
#   2. expand the shared cert to cover the new name:
#        sudo certbot --nginx --expand \
#          -d canary.ddyoru.cloud -d gatesimulator.ddyoru.cloud -d homepage.ddyoru.cloud \
#          -d ossimulator.ddyoru.cloud -d pizza.ddyoru.cloud -d privacy-ai-api.ddyoru.cloud \
#          -d privacy.ddyoru.cloud -d musicnote.ddyoru.cloud
#      (certbot rewrites ssl_certificate paths automatically if needed)
#   3. sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name musicnote.ddyoru.cloud;

    ssl_certificate /etc/letsencrypt/live/canary.ddyoru.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canary.ddyoru.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # audio uploads — keep in sync with MUSICNOTE_MAX_MB (40) plus headroom
    client_max_body_size 48m;

    access_log /var/log/nginx/musicnote.access.log;
    error_log  /var/log/nginx/musicnote.error.log;

    location / {
        proxy_pass http://127.0.0.1:8731/;
        include /etc/nginx/snippets/proxy-common.conf;

        # transcription of long files can take a few minutes
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
